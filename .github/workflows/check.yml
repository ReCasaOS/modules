# The check of a proposed change: builds the catalogue from the change's modules.env with
# the installer and the core pinned in refs.env, checks it against the published catalogue
# (no release may change under a published tag), proves that the core reads it, and writes
# what the change does to the published catalogue into the run's summary.
# A push to main runs only the check that unattested.txt did not grow.
#
# Read only, and never pull_request_target: a pull request from a fork runs here with no
# write right and no secret. The built file is not uploaded as an artifact (the installer
# pins no upload-artifact action); its SHA-256 is in the summary.
name: Check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # the list of unattested.txt only shrinks: no line that the base has not. The base is the
  # target branch of a pull request, or the commit main was at before a push to main.
  unattested:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check that unattested.txt only shrinks
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.base_ref) || github.event.before }}
        run: |
          git fetch -q --depth 1 origin "+${BASE}:refs/remotes/origin/base"
          bash scripts/unattested.sh check refs/remotes/origin/base

  # the whole check, of a proposed change only: a push to main is built by publish.yml
  check:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # 3.12: the Unicode tables of the Go that builds the core (see build-modules-catalogue.py)
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # setup-go needs the Go version before build.sh fetches the core: take the go.mod of the pinned commit
      - name: Read the go.mod of the pinned core
        run: |
          core_commit="$(sed -n 's/^CORE_COMMIT=\([0-9a-f]\{40\}\)$/\1/p' refs.env)"
          [[ "${core_commit}" =~ ^[0-9a-f]{40}$ ]] || { echo "refs.env has no valid CORE_COMMIT."; exit 1; }
          git init -q "${RUNNER_TEMP}/core-gomod"
          git -C "${RUNNER_TEMP}/core-gomod" fetch -q --depth 1 https://github.com/ReCasaOS/CasaOS "${core_commit}"
          git -C "${RUNNER_TEMP}/core-gomod" show FETCH_HEAD:go.mod >"${RUNNER_TEMP}/core-gomod/go.mod"

      # (setup-go parses the go line only of a file named go.mod)
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: ${{ runner.temp }}/core-gomod/go.mod
          cache: false

      # every test of tests/, so that a new one cannot be forgotten here
      - name: Test the scripts
        run: |
          for t in tests/*.sh; do bash "${t}"; done
          for t in tests/*.py; do python3 "${t}"; done

      # The catalogue published now: "nothing published yet" only on a 404 while the repository has no
      # release at all (asked with this job's read token); any other failure fails the check.
      # It is data: compare.py (run by build.sh) parses it strictly, nothing runs it.
      - name: Download the published catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/published.sh "${RUNNER_TEMP}/published"

      # GH_TOKEN: gh attestation verify (scripts/attest.sh) asks the API for the attestations of another
      # owner's archives, and gh needs a token for that, even a read only one. That a read only token is
      # enough, also in a pull request from a fork, is not proven until a module of another owner is built.
      - name: Build the catalogue, check it against the published one, prove that the core reads it
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/build.sh 1 out "${RUNNER_TEMP}/published"

      - name: Write the summary
        run: |
          {
            python3 scripts/summary.py "${RUNNER_TEMP}/published" out
            echo
            echo "SHA-256 of the built catalogue-2.json: \`$(sha256sum out/catalogue-2.json | cut -d' ' -f1)\`"
            echo "SHA-256 of the built catalogue-3.json: \`$(sha256sum out/catalogue-3.json | cut -d' ' -f1)\`"
          } >>"${GITHUB_STEP_SUMMARY}"
